<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Nuvio Standalone Embed Sniffer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: #121212; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { background: #1e1e1e; padding: 12px 16px; border-bottom: 1px solid #333; display: flex; gap: 10px; align-items: center; }
    input { flex: 1; padding: 8px 12px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 14px; }
    button { padding: 8px 16px; border-radius: 6px; border: none; background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button:hover { background: #1d4ed8; }
    .preset-btn { background: #374151; font-size: 12px; }
    .preset-btn:hover { background: #4b5563; }
    
    .container { flex: 1; display: flex; height: calc(100vh - 60px); }
    .web-panel { flex: 6; background: #000; display: flex; flex-direction: column; }
    webview { width: 100%; height: 100%; border: none; }
    
    .sniffer-panel { flex: 4; background: #18181b; border-left: 1px solid #333; display: flex; flex-direction: column; padding: 12px; }
    .panel-title { font-size: 16px; font-weight: 700; color: #38bdf8; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
    .stream-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .stream-card { background: #27272a; border: 1px solid #3f3f46; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
    .stream-card .badge { background: #16a34a; color: #fff; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; width: fit-content; }
    .stream-url { font-family: monospace; font-size: 11px; color: #a1a1aa; word-break: break-all; background: #18181b; padding: 6px; border-radius: 4px; }
    .copy-btn { background: #059669; font-size: 12px; padding: 4px 8px; align-self: flex-end; }
    .copy-btn:hover { background: #047857; }
    .empty-msg { color: #71717a; text-align: center; margin-top: 40px; font-size: 13px; }
  </style>
</head>
<body>

  <header>
    <input type="text" id="urlInput" value="https://myembed.biz/filme/tt0241527">
    <button onclick="loadEmbed()">🔍 Sniff Embed</button>
    <button class="preset-btn" onclick="setPreset('myembed_movie')">MyEmbed Filme</button>
    <button class="preset-btn" onclick="setPreset('myembed_serie')">MyEmbed Série</button>
  </header>

  <div class="container">
    <div class="web-panel">
      <webview id="embedWebview" src="https://myembed.biz/filme/tt0241527" allowpopups></webview>
    </div>


    <div class="sniffer-panel">
      <div class="panel-title">
        <span>⚡ Streams Interceptados (<span id="count">0</span>)</span>
        <button onclick="clearStreams()" style="background:#dc2626; font-size:11px; padding:4px 8px;">Limpar</button>
      </div>

      <div class="stream-list" id="streamList">
        <div class="empty-msg" id="emptyMsg">Aguardando o player carregar requisições .m3u8 / .mp4...</div>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const webview = document.getElementById('embedWebview');
    const urlInput = document.getElementById('urlInput');
    const streamList = document.getElementById('streamList');
    const emptyMsg = document.getElementById('emptyMsg');
    const countSpan = document.getElementById('count');

    let streams = [];

    function loadEmbed() {
      const url = urlInput.value.trim();
      if (url) {
        webview.src = url;
      }
    }

    function setPreset(type) {
      if (type === 'myembed_movie') {
        urlInput.value = 'https://myembed.biz/filme/tt0241527';
      } else if (type === 'myembed_serie') {
        urlInput.value = 'https://myembed.biz/serie/tt0903747/1/1';
      }
      loadEmbed();
    }


    function clearStreams() {
      streams = [];
      streamList.innerHTML = '';
      streamList.appendChild(emptyMsg);
      countSpan.innerText = '0';
    }

    ipcRenderer.on('stream-detected', (event, data) => {
      if (emptyMsg.parentNode) {
        emptyMsg.parentNode.removeChild(emptyMsg);
      }

      // Evita duplicados
      if (streams.some(s => s.url === data.url)) return;

      streams.push(data);
      countSpan.innerText = streams.length;

      const card = document.createElement('div');
      card.className = 'stream-card';
      card.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span class="badge">${data.url.includes('.m3u8') ? 'HLS STREAM (.m3u8)' : 'VIDEO MP4'}</span>
          <span style="font-size:11px; color:#71717a;">${data.timestamp}</span>
        </div>
        <div class="stream-url">${data.url}</div>
        <button class="copy-btn" onclick="copyUrl('${data.url}')">📋 Copiar Link Direct</button>
      `;
      streamList.prepend(card);
    });

    function copyUrl(text) {
      navigator.clipboard.writeText(text);
      alert('✅ Link de stream copiado para a área de transferência!');
    }
  </script>
</body>
</html>
